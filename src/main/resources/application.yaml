server:
  port: 6480

spring:
  application:
    name:
      my_bot

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/${POSTGRES_DB_NAME:postgres}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver


  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        order_inserts: true
        order_updates: true
        format_sql: true
        jdbc:
          batch_size: 100
          batch_versioned_data: true


  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:46379}



vk:
  submanager:
    callback:
      server:
        url: https://mycoolvkmanager.loca.lt/callback
        title: ChatManager
        api-version: 5.199

  main-bot:
   id: 194191149
   token:

security:
  encryption-key:
    A9sK2mP8xQ4nT7vW1yZ5cR3uB6hJ0eLf



logging:
  level:
   org:
    hibernate:
     engine:
      jdbc:
       batch:
         spi:
           Batch: TRACE
         internal:
          BatchingBatch: DEBUG

